name: Generate Snake Animation

# Builds the contribution-snake SVGs from Safayat's real contribution graph
# and publishes them to the `output` branch, where the README reads them from.

on:
  # Run automatically twice a day so the snake stays fresh.
  schedule:
    - cron: "0 */12 * * *"
  # Allow running it by hand from the Actions tab (Run workflow).
  workflow_dispatch:
  # Regenerate whenever you push to main (e.g. after editing the README).
  push:
    branches:
      - main

# Least-privilege: the job only needs to write the generated branch.
permissions:
  contents: write

# Avoid overlapping runs stepping on each other.
concurrency:
  group: snake-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs (dark + light)
        uses: Platane/snk@v3
        id: snake-gen
        with:
          github_user_name: ${{ github.repository_owner }}
          # Filenames requested in the README's <picture> block.
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#22d3ee
            dist/github-contribution-grid-snake.gif?color_snake=#22d3ee&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353

      - name: Publish to the `output` branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
